[project]
name = "simple-module-python-modules"
version = "0.0.15"
description = "Distributable modules for simple_module_python applications"
requires-python = ">=3.12"
dependencies = []

# Workspace root: not built or installed itself.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["host", "modules/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    "ruff>=0.8",
    "packaging>=24",
    "tomlkit>=0.13",
    # The newsletter tests run a local SMTP server; the Postgres job syncs
    # no extras, so a module's `dev` extra alone does not reach it.
    "aiosmtpd>=1.4.6",
    "basedpyright>=1.40.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic writes these; reformatting machine-generated DDL to satisfy a
# line-length rule adds churn to every migration for no benefit.
extend-exclude = ["host/migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "RET", "PTH", "PIE", "RUF"]
ignore = [
    "B008",   # Depends() in default args is idiomatic FastAPI
    "B027",   # Empty methods in ABC without @abstractmethod — optional hooks
]


# Type checking (#338): basedpyright in pyright's basic mode, run by `make lint`
# and CI's lint job. This include list is the whole scope, and it widens
# module by module: today every `contracts/` package plus the code in *other*
# modules that calls one, so a contract signature change fails at its callers.
# Add a module's remaining packages here once they check clean.
[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = [
    # The contracts packages.
    "modules/ai/sm_ai/contracts",
    "modules/billing/sm_billing/contracts",
    "modules/images/sm_images/contracts",
    "modules/news/news/contracts",
    "modules/pagebuilder/pagebuilder/contracts",
    "modules/records/sm_records/contracts",
    # Their callers in other modules.
    "modules/ai/sm_ai/core/constants.py",
    "modules/images/sm_images/core/billing/install.py",
    "modules/images/sm_images/core/billing/subject.py",
    "modules/images/sm_images/core/constants.py",
    "modules/images/sm_images/pipeline/ai/__init__.py",
    "modules/images/sm_images/pipeline/ai/group_run.py",
    "modules/images/sm_images/pipeline/ai/runner.py",
    "modules/images/sm_images/pipeline/steps/classify.py",
    "modules/news/news/integrations/bundle",
    "modules/news/news/integrations/pagebuilder.py",
    "modules/newsletter/sm_newsletter/campaigns/access.py",
    "modules/newsletter/sm_newsletter/campaigns/audience.py",
    "modules/newsletter/sm_newsletter/content/integrations",
    "modules/newsletter/sm_newsletter/core/suppression/mirror.py",
    "modules/newsletter/sm_newsletter/core/suppression/reconcile.py",
    "modules/newsletter/sm_newsletter/imports/apply.py",
    "modules/newsletter/sm_newsletter/imports/launch.py",
    "modules/newsletter/sm_newsletter/imports/lists.py",
    "modules/newsletter/sm_newsletter/imports/mapping.py",
    "modules/newsletter/sm_newsletter/imports/runner.py",
    "modules/newsletter/sm_newsletter/imports/service.py",
    "modules/newsletter/sm_newsletter/imports/staging.py",
    "modules/newsletter/sm_newsletter/imports/tags.py",
    "modules/newsletter/sm_newsletter/imports/tags_step.py",
    "modules/newsletter/sm_newsletter/segments/rules.py",
    "modules/newsletter/sm_newsletter/segments/store.py",
    "modules/newsletter/sm_newsletter/sending/deliver.py",
    "modules/newsletter/sm_newsletter/sending/freeze.py",
    "modules/newsletter/sm_newsletter/sending/freeze_pages.py",
    "modules/newsletter/sm_newsletter/subscribers/actions.py",
    "modules/newsletter/sm_newsletter/subscribers/browse.py",
    "modules/newsletter/sm_newsletter/subscribers/lift.py",
    "modules/newsletter/sm_newsletter/web/endpoints/audience_api.py",
    "modules/newsletter/sm_newsletter/web/endpoints/campaigns_api.py",
    "modules/newsletter/sm_newsletter/web/endpoints/cards_api.py",
    "modules/newsletter/sm_newsletter/web/endpoints/imports_api.py",
    "modules/newsletter/sm_newsletter/web/endpoints/preview_api.py",
    "modules/newsletter/sm_newsletter/web/endpoints/report_api.py",
    "modules/newsletter/sm_newsletter/web/endpoints/segments_api.py",
    "modules/newsletter/sm_newsletter/web/endpoints/sending_api.py",
    "modules/newsletter/sm_newsletter/web/endpoints/subscribers_api.py",
    "modules/newsletter/sm_newsletter/web/endpoints/suppressions_api.py",
    "modules/newsletter/sm_newsletter/web/endpoints/test_send_api.py",
    "modules/newsletter/sm_newsletter/web/endpoints/views.py",
    "modules/newsletter/sm_newsletter/web/schemas/imports.py",
    "modules/newsletter/sm_newsletter/web/schemas/segments.py",
    "modules/newsletter/sm_newsletter/web/schemas/subscribers.py",
    "modules/newsletter/sm_newsletter/web/services/unsubscribe.py",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "host/tests",
    "modules/ai/tests",
    "modules/analytics/tests",
    "modules/billing/tests",
    "modules/images/tests",
    "modules/news/tests",
    "modules/newsletter/tests",
    "modules/pagebuilder/tests",
    "modules/records/tests",
    "scripts/tests",
]
addopts = "--durations=20 -m 'not perf'"
markers = ["perf: performance measurement, excluded from the default run"]
