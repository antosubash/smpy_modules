[project]
name = "smpy-modules-host"
version = "0.1.0"
description = "Demo host mounting every module in this repo"
requires-python = ">=3.12"
dependencies = [
    "simple_module_hosting==0.0.35",
    "simple_module_auth==0.0.35",
    "simple_module_users==0.0.35",
    "simple_module_dashboard==0.0.35",
    "simple_module_permissions==0.0.35",
    "simple_module_branding==0.0.35",
    "simple_module_pagebuilder",
    "simple_module_canopy_atlas",
    "simple_module_news",
    "simple_module_ai",
    "simple_module_records",
]

# Host is an application, not a distributable package.
[tool.uv]
package = false

# In-repo modules resolve from the workspace, not PyPI.
[tool.uv.sources.simple_module_pagebuilder]
workspace = true

[tool.uv.sources.simple_module_canopy_atlas]
workspace = true

[tool.uv.sources.simple_module_news]
workspace = true

[tool.uv.sources.simple_module_ai]
workspace = true

[tool.uv.sources.simple_module_records]
workspace = true

[dependency-groups]
dev = [
    "simple_module_test==0.0.35",
    "simple-module-cli==0.0.35",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
]
