[project]
name = "simple_module_pagebuilder"
version = "0.0.7"
description = "Drag-and-drop visual page builder for simple_module apps"
readme = "README.md"
license = "MIT"
authors = [{ name = "Anto Subash", email = "antosubash@live.com" }]
keywords = ["simple-module", "pagebuilder", "cms", "puck"]
requires-python = ">=3.12"
dependencies = [
    # Ranges, not exact pins: an `==` here would make this module
    # uninstallable in any host running a newer framework build.
    "simple_module_core>=0.0.25,<0.1",
    "simple_module_db>=0.0.25,<0.1",
    "simple_module_hosting>=0.0.25,<0.1",
    # This module's settings live in the DB-backed settings store, so
    # ``register_settings`` imports ``settings.registration``. Floor verified:
    # ``register_module_settings`` and ``apply_changes_and_reload`` both exist
    # at 0.0.25.
    "simple_module_settings>=0.0.25,<0.1",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.21",
    "Pillow>=10.0",
]

[project.urls]
Repository = "https://github.com/antosubash/simple_module_python_modules"

[project.entry-points.simple_module]
pagebuilder = "pagebuilder.module:PagebuilderModule"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "simple_module_test>=0.0.25,<0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pagebuilder"]
# The built frontend bundle is gitignored, so hatchling's VCS-aware file
# selection skips it. `artifacts` is the supported way to pull ignored build
# output back in. A force-include can't be used here: it demands the path
# exist, which breaks a build from a clean checkout, and it double-adds any
# file that is tracked.
artifacts = ["pagebuilder/static/dist/**"]

# package.json lives at the module root so npm workspaces see it; copying it
# into the package lets a wheel-installed host discover the module's JS deps
# through importlib.resources.
[tool.hatch.build.targets.wheel.force-include]
"package.json" = "pagebuilder/package.json"

[tool.hatch.build.targets.sdist]
artifacts = ["pagebuilder/static/dist/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# `db_fixture` holds the bare-session fixture, `locale_fixture` the
# multilingual app, and `snapshot_fixture` the session + settings pair the
# snapshot layer's tests use. Registered here rather than imported from
# conftest.py, which sits exactly on the repo's 300-line cap.
pythonpath = ["tests"]
addopts = "-p db_fixture -p locale_fixture -p snapshot_fixture"
