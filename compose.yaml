# The demo host in a container: the API serving the pre-built UI, nothing else.
#
#   make env                      # once: .env with a generated SM_SECRET_KEY
#   docker compose up -d --build  # http://localhost:8090
#   docker compose down           # add -v to drop the data volumes
#
# There is deliberately no database service. CLAUDE.md forbids a per-project
# Postgres container, so the host runs on SQLite in the `smpy-data` volume by
# default, or on the shared dev-services Postgres: add compose.devnet.yaml to
# join its network and set SMPY_DATABASE_URL (see that file).
#
# Variables read here (from the shell, or this directory's .env, which compose
# reads for interpolation). They are SMPY_*, not SM_*, because .env's own
# SM_DATABASE_URL and SM_ENVIRONMENT describe a process on this machine, not in
# a container:
#   SMPY_PORT          host port to publish on (default 8090)
#   SMPY_BIND_ADDRESS  host interface to publish on (default 127.0.0.1, this
#                      machine only; 0.0.0.0 exposes it to the network)
#   SMPY_MIGRATE_ON_START  1 (default) applies migrations before serving; set
#                      0 when another process runs them (see entrypoint.sh)
#   SMPY_ENV_FILE      env file handed to the app (default .env)
#   SMPY_DATABASE_URL  database URL as seen from inside the container
#                      (default SQLite at /app/var/app.db, in the volume)

name: smpy-modules

services:
  host:
    build: .
    image: smpy-modules-host:dev
    # Secrets (SM_SECRET_KEY, SM_USERS_BOOTSTRAP_*) and every other SM_*
    # setting come from this file. It is never baked into the image.
    env_file:
      - path: ${SMPY_ENV_FILE:-.env}
        required: true
    # These win over the env file.
    environment:
      SM_ENVIRONMENT: production
      SM_DATABASE_URL: ${SMPY_DATABASE_URL:-sqlite+aiosqlite:////app/var/app.db}
      SMPY_MIGRATE_ON_START: ${SMPY_MIGRATE_ON_START:-1}
      PORT: "8000"
    ports:
      - "${SMPY_BIND_ADDRESS:-127.0.0.1}:${SMPY_PORT:-8090}:8000"
    volumes:
      # SQLite database plus pagebuilder media and snapshots.
      - smpy-data:/app/var
      # file_storage's local backend.
      - smpy-uploads:/app/uploads
    restart: unless-stopped

volumes:
  smpy-data:
  smpy-uploads:
