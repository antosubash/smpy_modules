# Opt-in: the images `anonymize` step against its real detectors.
#
# ci.yml syncs with `--no-extra anonymize`, so the step's default tests run on
# a fake detector and no pull request downloads model weights. This job syncs
# the `[anonymize]` extra (onnxruntime) from the lock, downloads the pinned,
# checksummed ONNX models (sm_images/pipeline/steps/anonymize/weights.py: YuNet faces,
# YOLOv9 plates, both MIT) and runs the tests marked `real_models`, which the
# module's addopts deselect everywhere else.
#
# Weekly and by hand. Keep `UV_VERSION` equal to ci.yml's (#120).

name: images-models

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-models-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.13.4"

jobs:
  real-models:
    name: images anonymize (real models)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          # A cache saved by a schedule on main is restorable by ci.yml.
          enable-cache: false

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync workspace (with the anonymize extra)
        run: uv sync --locked --all-packages --all-extras

      - name: Run pytest (images, real models)
        run: cd modules/images && uv run --no-sync pytest -q -p no:cacheprovider -m real_models
