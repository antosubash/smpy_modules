# Pull-request gate. All jobs must pass before merging.
# Mark them as required checks in the branch-protection rules for `main`.
#
# `astral-sh/setup-uv` is pinned to a full `x.y.z` tag, unlike the `actions/*`
# steps which float on their major. That is deliberate: setup-uv stopped
# publishing major/minor tags at v8 (as a supply-chain hardening measure), so
# `@v9` does not resolve. Bump it by hand when a new release lands.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run when a new commit is pushed to the same ref,
# unless that ref is `main` (we always want main's history to be fully
# verified). `github.ref` is the branch ref for push events and
# `refs/pull/<n>/merge` for pull_request events, so the same group key
# collapses concurrent runs of either type on the same PR / branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  lint-python:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Ruff check
        run: uvx ruff check .

  python-tests:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}


      - name: Sync workspace (all packages, with dev extras)
        run: uv sync --all-packages --all-extras

      # Run pytest from within each module so each picks up its own
      # `[tool.pytest.ini_options]` (e.g. `asyncio_mode = "auto"`).
      - name: Run pytest (ai)
        run: cd modules/ai && uv run pytest

      - name: Run pytest (pagebuilder)
        run: cd modules/pagebuilder && uv run pytest

      - name: Run pytest (news)
        run: cd modules/news && uv run pytest

      - name: Run pytest (records)
        run: cd modules/records && uv run pytest

      - name: Run pytest (host)
        run: uv run pytest host/tests

  frontend-build:
    name: Frontend build (tsc + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm


      - name: Sync Python workspace
        run: uv sync --all-packages

      - name: Install npm workspace
        run: npm ci

      - name: Sync module JS deps into host
        run: make sync-module-deps

      - name: Generate pages manifest
        run: make gen-pages

      - name: Build frontend (typecheck + vite build)
        run: npm run build

  frontend-unit:
    name: Frontend unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm workspace
        run: npm ci

      # `vitest.config.ts` covers modules/**/*.test.ts(x). These ran only via
      # `make test-js` locally, so nothing stopped a regression they catch from
      # merging — the e2e job is the slow, partial backstop.
      - name: Run vitest
        run: npx vitest run

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Hard ceiling so a hung webServer / runaway test can't burn 6h of
    # billable runner time. Adjust upward only if the suite legitimately
    # grows beyond this.
    #
    # Raised from 15 when the multilingual specs landed: a green run reached
    # test 138 of 143 at 15m17s and was cancelled with the last file still to
    # go. At ~7s a test the suite now needs a little under 16 minutes, so 25
    # leaves room for a slow runner without going near the billable runaway
    # this ceiling exists to stop.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm


      - name: Sync Python workspace
        run: uv sync --all-packages --all-extras

      - name: Install npm workspace
        run: npm ci

      - name: Sync module JS deps into host
        run: make sync-module-deps

      - name: Generate pages manifest
        run: make gen-pages

      # Cache Chromium + system deps between runs so we don't redownload
      # ~290 MB every PR push. Key on the Playwright version so a bump
      # invalidates the cache automatically.
      - name: Resolve Playwright version
        id: pw-version
        run: |
          v=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      # Step-level timeout so a hung mirror / stalled apt can't sit for
      # the full job budget. 8 min is comfortably above the normal ~2 min
      # cold install but well below `timeout-minutes` at the job level.
      - name: Install Playwright browsers
        timeout-minutes: 8
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            # Browsers cached — only refresh OS-level deps (fast).
            npx playwright install-deps chromium
          else
            npx playwright install chromium --with-deps
          fi

      # `--max-failures=1` aborts the suite on the first failing test so a
      # broken build doesn't drag the whole runner out to the job timeout.
      - name: Run Playwright tests
        run: npm run test:e2e -- --max-failures=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  lint-js:
    name: Lint (biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm workspace
        run: npm ci

      - name: Biome check
        run: npx biome check .

  checks:
    name: Repo checks (metadata, readmes, strings, file size)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}


      - name: Sync workspace
        run: uv sync --all-packages --all-extras

      - name: Package metadata
        run: uv run python scripts/check_metadata.py

      - name: READMEs
        run: uv run python scripts/check_readmes.py

      - name: Hardcoded strings
        run: uv run python scripts/check_hardcoded_strings.py

      - name: File size
        run: uv run python scripts/check_file_size.py

      # Guards the lockstep invariant: every publishable manifest carries the
      # same version as the repo root.
      - name: Version sync
        run: uv run python scripts/bump_version.py --check-current

      - name: Bump script tests
        run: uv run pytest scripts/tests
