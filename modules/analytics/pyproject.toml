[project]
name = "simple_module_analytics"
version = "0.0.15"
description = "Anonymous tenant-scoped web and application analytics with local GeoIP"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
keywords = ["simple-module", "analytics", "geoip", "web-analytics"]
dependencies = [
    "simple_module_core>=0.0.44,<0.1",
    "simple_module_db>=0.0.44,<0.1",
    "simple_module_hosting>=0.0.44,<0.1",
    "simple_module_inertia>=0.0.44,<0.1",
    "simple_module_settings>=0.0.44,<0.1", # floor: settings module layout first shipped in 0.0.44
    "pydantic-settings>=2.0",
]

[project.urls]
Repository = "https://github.com/antosubash/simple_module_python_modules"

[project.optional-dependencies]
geoip = ["geoip2>=5.2,<6"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "simple_module_test>=0.0.44,<0.1"]

[project.entry-points.simple_module]
analytics = "sm_analytics.module:AnalyticsModule"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sm_analytics"]
exclude = ["**/*.test.ts", "**/*.test.tsx", "**/page-tests/**", "**/test-dom.tsx"]

[tool.hatch.build.targets.wheel.force-include]
"package.json" = "sm_analytics/package.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
