# Pull-request gate. All jobs must pass before merging.
# Mark them as required checks in the branch-protection rules for `main`.
#
# `astral-sh/setup-uv` is pinned to a full `x.y.z` tag, unlike the `actions/*`
# steps which float on their major. That is deliberate: setup-uv stopped
# publishing major/minor tags at v8 (as a supply-chain hardening measure), so
# `@v9` does not resolve. Bump it by hand when a new release lands.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run when a new commit is pushed to the same ref,
# unless that ref is `main` (we always want main's history to be fully
# verified). `github.ref` is the branch ref for push events and
# `refs/pull/<n>/merge` for pull_request events, so the same group key
# collapses concurrent runs of either type on the same PR / branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  lint-python:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Ruff check
        run: uvx ruff check .

  python-tests:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}


      - name: Sync workspace (all packages, with dev extras)
        run: uv sync --all-packages --all-extras

      # Run pytest from within each module so each picks up its own
      # `[tool.pytest.ini_options]` (e.g. `asyncio_mode = "auto"`).
      - name: Run pytest (ai)
        run: cd modules/ai && uv run pytest

      - name: Run pytest (pagebuilder)
        run: cd modules/pagebuilder && uv run pytest

      - name: Run pytest (news)
        run: cd modules/news && uv run pytest

      - name: Run pytest (records)
        run: cd modules/records && uv run pytest

      - name: Run pytest (host)
        run: uv run pytest host/tests

  postgres:
    name: Postgres (migrations + records)
    runs-on: ubuntu-latest
    # The records unit suite alone is ~3 min on SQLite (~4 min measured
    # against Postgres — postgres-2026-09-21.md § 3); the migration round
    # trip and perf smoke add a few minutes more. 20 gives comfortable room
    # without chasing a hung step to the billable ceiling.
    timeout-minutes: 20
    services:
      # `postgres:16` is what postgres-2026-09-21.md verified against
      # (16.13). POSTGRES_DB pre-creates the database the migration round
      # trip runs against; the records unit and perf databases are created
      # by a later step because pg_support.py and the perf suite each want
      # their own (TRUNCATE-per-test and CREATE DATABASE … TEMPLATE would
      # otherwise collide with the migrated schema).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync workspace (all packages)
        run: uv sync --all-packages

      # `ubuntu-latest` ships the postgresql-client tools, so `createdb`
      # needs no extra install. Two databases: one for the records unit
      # suite (pg_support.py's TRUNCATE … RESTART IDENTITY reset) and one
      # for the perf smoke (which also does CREATE DATABASE … TEMPLATE
      # copies of its own) — kept apart from `ci`, and from each other, so
      # none of the three resets the others' schema mid-job.
      - name: Create records test databases
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres ci_records
          PGPASSWORD=postgres createdb -h localhost -U postgres ci_records_perf

      # Migration round trip against a real Postgres database — this is what
      # caught the four Postgres-only migration bugs in
      # postgres-2026-09-21.md § 2 (a boolean server_default of `0`, an enum
      # server_default naming a value where SQLAlchemy stores the name, and
      # two revisions whose downgrade left enum types behind). None of them
      # was visible on SQLite, and `alembic check` alone (no downgrade) missed
      # the enum-leftover bug too.
      - name: Migrate up (heads)
        env:
          SM_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci
        run: uv run --project host alembic -c host/alembic.ini upgrade heads

      - name: Alembic check (after upgrade)
        env:
          SM_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci
        run: uv run --project host alembic -c host/alembic.ini check

      - name: Migrate down (base)
        env:
          SM_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci
        run: uv run --project host alembic -c host/alembic.ini downgrade base

      - name: Migrate up again (heads)
        env:
          SM_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci
        run: uv run --project host alembic -c host/alembic.ini upgrade heads

      - name: Alembic check (after round trip)
        env:
          SM_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci
        run: uv run --project host alembic -c host/alembic.ini check

      # Both RECORDS_TEST_URL (tests/pg_support.py, today) and
      # SM_TEST_DATABASE_URL (the name it and pagebuilder/news are being
      # generalised to — RECORDS_TEST_URL stays as an alias) point at the
      # same database, so this step works before and after that rename lands.
      - name: Run pytest (records, Postgres)
        env:
          RECORDS_TEST_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci_records
          SM_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci_records
        run: cd modules/records && uv run pytest -q -p no:cacheprovider

      # A short smoke, not the full study (which runs at N=20000): enough to
      # exercise the write, read, aggregate and i18n statement-count
      # assertions against a real Postgres database on every PR.
      # tests/perf/conftest.py and the perf test files assert either bounded
      # ceilings (`< 40`) or self-consistency across two runs on the same
      # backend, never a hard-coded SQLite statement count, so the suite
      # needs no `-k` filter here.
      - name: Run pytest (records perf smoke, Postgres)
        env:
          RECORDS_PERF_N: 500
          RECORDS_PERF_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci_records_perf
        run: cd modules/records && uv run pytest -q -m perf tests/perf

  frontend-build:
    name: Frontend build (tsc + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm


      - name: Sync Python workspace
        run: uv sync --all-packages

      - name: Install npm workspace
        run: npm ci

      - name: Sync module JS deps into host
        run: make sync-module-deps

      - name: Generate pages manifest
        run: make gen-pages

      - name: Build frontend (typecheck + vite build)
        run: npm run build

  frontend-unit:
    name: Frontend unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm workspace
        run: npm ci

      # `vitest.config.ts` covers modules/**/*.test.ts(x). These ran only via
      # `make test-js` locally, so nothing stopped a regression they catch from
      # merging — the e2e job is the slow, partial backstop.
      - name: Run vitest
        run: npx vitest run

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Hard ceiling so a hung webServer / runaway test can't burn 6h of
    # billable runner time. Adjust upward only if the suite legitimately
    # grows beyond this.
    #
    # Raised from 15 when the multilingual specs landed (a green run reached
    # test 138 of 143 at 15m17s and was cancelled with the last file still to
    # go), and from 25 when the records specs took the suite from 149 tests to
    # 257 — 24 `records-*.spec.ts` files, 108 tests. At the same measured ~7s a
    # test that is ~30 minutes of tests alone, and `uv sync`, `npm ci`,
    # `make sync-module-deps`, `make gen-pages`, the Playwright browser install
    # and up to 180s of `webServer` boot all sit inside this ceiling too. 45
    # covers that with room for a slow runner and the odd retry, without going
    # near the billable runaway this ceiling exists to stop.
    #
    # Not sharded, and the number is sized on the assumption that it stays that
    # way: `playwright.config.ts` sets `workers: 1` / `fullyParallel: false` on
    # purpose, because every spec runs against the one host and the one SQLite
    # database `start-test-server.sh` builds. A second worker is a second
    # writer to that database, not a second suite.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm


      - name: Sync Python workspace
        run: uv sync --all-packages --all-extras

      - name: Install npm workspace
        run: npm ci

      - name: Sync module JS deps into host
        run: make sync-module-deps

      - name: Generate pages manifest
        run: make gen-pages

      # Cache Chromium + system deps between runs so we don't redownload
      # ~290 MB every PR push. Key on the Playwright version so a bump
      # invalidates the cache automatically.
      - name: Resolve Playwright version
        id: pw-version
        run: |
          v=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      # Step-level timeout so a hung mirror / stalled apt can't sit for
      # the full job budget. 8 min is comfortably above the normal ~2 min
      # cold install but well below `timeout-minutes` at the job level.
      - name: Install Playwright browsers
        timeout-minutes: 8
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            # Browsers cached — only refresh OS-level deps (fast).
            npx playwright install-deps chromium
          else
            npx playwright install chromium --with-deps
          fi

      # `--max-failures=1` aborts the suite on the first failing test so a
      # broken build doesn't drag the whole runner out to the job timeout.
      - name: Run Playwright tests
        run: npm run test:e2e -- --max-failures=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  lint-js:
    name: Lint (biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm workspace
        run: npm ci

      - name: Biome check
        run: npx biome check .

  checks:
    name: Repo checks (metadata, readmes, strings, file size)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}


      - name: Sync workspace
        run: uv sync --all-packages --all-extras

      - name: Package metadata
        run: uv run python scripts/check_metadata.py

      - name: READMEs
        run: uv run python scripts/check_readmes.py

      - name: Hardcoded strings
        run: uv run python scripts/check_hardcoded_strings.py

      - name: File size
        run: uv run python scripts/check_file_size.py

      # Guards the lockstep invariant: every publishable manifest carries the
      # same version as the repo root.
      - name: Version sync
        run: uv run python scripts/bump_version.py --check-current

      - name: Bump script tests
        run: uv run pytest scripts/tests
