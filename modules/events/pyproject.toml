[project]
name = "simple_module_events"
version = "0.0.15"
description = "Calendars and events for SimpleModule hosts: timezone-aware and recurring events, shareable calendars, public pages and ICS feeds"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
authors = [{ name = "Anto Subash", email = "antosubash@live.com" }]
keywords = ["simple-module", "events", "calendar"]
# Ranges, never `==`: an exact framework pin makes a published module
# uninstallable in any host running a newer framework build.
dependencies = [
    "simple_module_core>=0.0.44,<0.1",
    "simple_module_db>=0.0.44,<0.1",
    "simple_module_hosting>=0.0.44,<0.1",
    "simple_module_inertia>=0.0.44,<0.1",
    "simple_module_settings>=0.0.44,<0.1",  # floor: settings.core and settings.module_settings paths first shipped in 0.0.44
    "simple_module_sharing>=0.0.44,<0.1",  # floor: sharing.core.policy path first shipped in 0.0.44
    "python-dateutil>=2.9,<4",
    "pydantic-settings>=2.0",
]

[project.urls]
Repository = "https://github.com/antosubash/simple_module_python_modules"

[project.entry-points.simple_module]
events = "sm_events.module:EventsModule"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "simple_module_test>=0.0.44,<0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sm_events"]
# Frontend test files and their helpers sit beside the source they test, so
# `packages` would ship them. A host's Vite scans installed module source and
# skips dependency pre-bundling when it meets an import it cannot resolve
# (`vitest`), so none of them may reach the wheel (#63).
exclude = [
    "**/*.test.ts",
    "**/*.test.tsx",
    "**/__tests__/**",
    "**/test-dom.tsx",
    "**/*-test-support.ts",
    "**/*-test-support.tsx",
    "**/page-tests/**",
]
artifacts = ["sm_events/static/dist/**"]

# package.json lives at the module root so npm workspaces see it; copying it
# into the package lets the host discover JS deps after a pip install.
[tool.hatch.build.targets.wheel.force-include]
"package.json" = "sm_events/package.json"

[tool.hatch.build.targets.sdist]
artifacts = ["sm_events/static/dist/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "unbound_tenant: run with no events tenant bound (tests/conftest.py binds 'default' otherwise)",
]
