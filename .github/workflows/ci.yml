# Pull-request gate. All jobs must pass before merging.
# Mark them as required checks in the branch-protection rules for `main`.
#
# Every action is pinned by commit SHA, with its release in a trailing comment,
# as in release.yml and .github/actions/e2e-setup (#360): a tag can be moved by
# whoever controls the action's repository, a commit cannot. Dependabot's
# `github-actions` entry updates the SHA and the comment together. (setup-uv
# publishes no major/minor tags since v8 anyway, so it could not float.)
#
# uv itself is pinned through `UV_VERSION` below rather than `latest`, so a uv
# release cannot change resolution or lockfile behaviour under an unchanged
# PR (#120). Dependabot does not track this value; bump it by hand, together
# with the copy in release.yml.

name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets. A branch stacked on another
  # feature branch — #34 on #29 — otherwise gets no checks at all, and its
  # only verification is whatever the author ran locally. The required-check
  # gate on `main` is unchanged; this only adds coverage for PRs that are not
  # yet aimed at it.
  pull_request:
  # A commit with no CI run of its own — the release bot's "Release vX" push
  # does not trigger workflows — can be checked by hand before release.yml,
  # which requires a green run on the commit it ships (#115).
  workflow_dispatch:

# Cancel any in-progress run when a new commit is pushed to the same ref,
# unless that ref is `main` (we always want main's history to be fully
# verified). `github.ref` is the branch ref for push events and
# `refs/pull/<n>/merge` for pull_request events, so the same group key
# collapses concurrent runs of either type on the same PR / branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Stated rather than left to the repository's default token setting (#360).
permissions:
  contents: read

# PYTHON_VERSION is what every job but `python-tests` runs; that one is a
# matrix of 3.12 (the floor every module declares) and 3.14 (what the
# Dockerfile's runtime stage ships), #359. NODE_VERSION is the Dockerfile's
# `ui` stage major (node:26.x); keep the two, and release.yml's copy, together.
env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "26"
  UV_VERSION: "0.13.4"

jobs:
  lint-python:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      # The ruff in uv.lock's dev group, not whatever `uvx` resolves today: a
      # new ruff release must not turn every PR red (#120). `--only-dev`
      # skips the workspace packages, which ruff does not need installed.
      - name: Install dev tools
        run: uv sync --locked --only-dev

      - name: Ruff check
        run: uv run --no-sync ruff check .

      # Pyright resolves imports, so it needs the workspace installed. The
      # basedpyright wheel bundles Node (nodejs-wheel), so no setup-node step.
      # What it checks is [tool.pyright] include in pyproject.toml (#338).
      - name: Install workspace packages
        run: uv sync --locked --all-packages --all-extras --no-extra anonymize

      - name: Pyright (basic)
        run: uv run --no-sync basedpyright

  # 3.12 is the `requires-python` floor; 3.14 is the interpreter the demo
  # image runs (#359). UV_PYTHON makes every uv command below, the ones
  # scripts/pytest_modules.sh runs included, use the leg's interpreter instead
  # of .python-version's.
  python-tests:
    name: Python tests (pytest, ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # One version failing must not hide whether the other passes.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      # The images module shells out to tippecanoe to build vector tiles.
      - name: Install tippecanoe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tippecanoe

      - name: Sync workspace (all packages, with dev extras)
        run: uv sync --locked --all-packages --all-extras --no-extra anonymize

      # Every modules/*/, each from its own directory, all of them even after
      # one fails — see the script for why.
      - name: Run pytest (each module)
        run: scripts/pytest_modules.sh

      - name: Run pytest (host)
        run: uv run pytest -n "${PYTEST_WORKERS:-auto}" host/tests

  postgres:
    name: Postgres (migrations + module suites)
    runs-on: ubuntu-latest
    # The records unit suite alone is ~3 min on SQLite (~4 min measured
    # against Postgres — postgres-2026-09-21.md § 3); the migration round
    # trip and perf smoke add a few minutes more, and pagebuilder, news and
    # billing about as much again (#117). 30 gives room without chasing a
    # hung step to the billable ceiling.
    timeout-minutes: 30
    services:
      # `postgres:16` is what postgres-2026-09-21.md verified against
      # (16.13). POSTGRES_DB pre-creates the database the migration round
      # trip runs against; each module's database and the records perf one
      # are created by the test steps because pg_support.py and the perf
      # suite each want their own (TRUNCATE-per-test and CREATE DATABASE … TEMPLATE would
      # otherwise collide with the migrated schema).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      # The images module shells out to tippecanoe to build vector tiles.
      - name: Install tippecanoe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tippecanoe

      - name: Sync workspace (all packages)
        run: uv sync --locked --all-packages

      # Migration round trip against a real Postgres database — this is what
      # caught the four Postgres-only migration bugs in
      # postgres-2026-09-21.md § 2 (a boolean server_default of `0`, an enum
      # server_default naming a value where SQLAlchemy stores the name, and
      # two revisions whose downgrade left enum types behind). None of them
      # was visible on SQLite, and `alembic check` alone (no downgrade) missed
      # the enum-leftover bug too.
      - name: Migrate up (heads)
        env:
          SM_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci
        run: uv run --project host alembic -c host/alembic.ini upgrade heads

      - name: Alembic check (after upgrade)
        env:
          SM_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci
        run: uv run --project host alembic -c host/alembic.ini check

      - name: Migrate down (base)
        env:
          SM_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci
        run: uv run --project host alembic -c host/alembic.ini downgrade base

      - name: Migrate up again (heads)
        env:
          SM_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci
        run: uv run --project host alembic -c host/alembic.ini upgrade heads

      - name: Alembic check (after round trip)
        env:
          SM_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci
        run: uv run --project host alembic -c host/alembic.ini check

      # `ubuntu-latest` ships the postgresql-client tools, so `createdb`
      # needs no extra install. One database per suite, kept apart from `ci`
      # and from each other, because each resets its database its own way:
      # records, pagebuilder and news through pg_support.py's TRUNCATE …
      # RESTART IDENTITY, billing (simple_module_test's fixtures) by dropping
      # and recreating the `public` schema, and the records perf smoke with
      # CREATE DATABASE … TEMPLATE copies of its own. The suites run on
      # pytest-xdist workers, and simple_module_test points each worker at a
      # database of its own (`ci_records_gw0`, `ci_records_gw1`, …), created
      # on first use, so two workers never truncate each other's rows. The
      # perf smoke stays serial: it measures.
      #
      # scripts/pytest_modules_pg.sh runs every modules/*/ — the full suites,
      # not a subset, whose tenant-filtered queries, scheduler claims and row
      # locks behave differently on Postgres (#117) — each on its own
      # `ci_<module>` database (SM_TEST_DATABASE_URL, the name
      # tests/pg_support.py reads first), and every one even after an earlier
      # one failed. A new module runs here without editing this file (#360).
      - name: Run pytest (each module, Postgres)
        if: ${{ !cancelled() }}
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: scripts/pytest_modules_pg.sh

      # A short smoke, not the full study (which runs at N=20000): enough to
      # exercise the write, read, aggregate and i18n statement-count
      # assertions against a real Postgres database on every PR.
      # tests/perf/conftest.py and the perf test files assert either bounded
      # ceilings (`< 40`) or self-consistency across two runs on the same
      # backend, never a hard-coded SQLite statement count, so the suite
      # needs no `-k` filter here.
      - name: Run pytest (records perf smoke, Postgres)
        if: ${{ !cancelled() }}
        env:
          RECORDS_PERF_N: 500
          RECORDS_PERF_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci_records_perf
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres ci_records_perf
          cd modules/records && uv run pytest -q -m perf tests/perf

  frontend-build:
    name: Frontend build (tsc + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm


      - name: Sync Python workspace
        run: uv sync --locked --all-packages

      - name: Install npm workspace
        run: npm ci

      - name: Sync module JS deps into host
        run: make sync-module-deps

      - name: Generate pages manifest
        run: make gen-pages

      # `npm run build` type-checks host/client_app only. Module TSX — and the
      # typed `t(keys.<module>…)` lookups, which rely on tsc rejecting an
      # unknown key — is checked by `make typecheck`, per module (#113).
      - name: Typecheck modules
        run: make typecheck

      - name: Build frontend (typecheck + vite build)
        run: npm run build

  # The demo host's Dockerfile (#91) still builds, and the image it builds
  # boots (#359): the container applies the migrations and serves
  # `/health/live` under SM_ENVIRONMENT=production on Python 3.14, the
  # interpreter its runtime stage ships. Nothing is pushed; the image is never
  # published. The GitHub Actions cache keeps a rebuild to the layers a change
  # actually touched.
  docker-image:
    name: Docker image (build + boot)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          # Into the runner's image store, so the next step can run it.
          load: true
          tags: smpy-modules-host:ci
          # An explicit scope keeps this cache apart from any other image
          # built with the gha backend in this repo.
          cache-from: type=gha,scope=ci-demo-host
          cache-to: type=gha,mode=max,scope=ci-demo-host

      # What compose.yaml hands the container, minus the env file: production
      # refuses to boot without SM_SECRET_KEY and the two users token secrets
      # (`make env` generates the same three), and background_tasks rejects
      # its default localhost broker there, so the in-process transports
      # compose.yaml names. Throwaway values, generated per run. The image's
      # own ENV sets SM_ENVIRONMENT=production, the SQLite database in
      # /app/var and SMPY_MIGRATE_ON_START=1.
      - name: Start the image
        run: |
          docker run -d --name smpy-host -p 127.0.0.1:8000:8000 \
            -e SM_SECRET_KEY="$(openssl rand -hex 32)" \
            -e SM_USERS_RESET_PASSWORD_TOKEN_SECRET="$(openssl rand -hex 32)" \
            -e SM_USERS_VERIFICATION_TOKEN_SECRET="$(openssl rand -hex 32)" \
            -e SM_BG_TASKS_TASK_ALWAYS_EAGER=true \
            -e SM_BG_TASKS_BROKER_URL=memory:// \
            -e SM_BG_TASKS_RESULT_BACKEND=cache+memory:// \
            -e SM_BG_TASKS_BROADCAST_INVALIDATIONS=false \
            smpy-modules-host:ci

      # Two minutes for the migrations and the boot. Stops early once the
      # container has exited, since nothing will answer then.
      - name: Wait for /health/live
        run: |
          deadline=$((SECONDS + 120))
          until curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:8000/health/live; do
            if [ "$(docker inspect -f '{{.State.Running}}' smpy-host)" != true ]; then
              echo "::error::the container exited before /health/live answered"
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::/health/live did not answer within 120 s"
              exit 1
            fi
            sleep 2
          done

      - name: Container logs
        if: ${{ !cancelled() }}
        run: docker logs smpy-host

  frontend-unit:
    name: Frontend unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm workspace
        run: npm ci

      # `vitest.config.ts` covers modules/**/*.test.ts(x). These ran only via
      # `make test-js` locally, so nothing stopped a regression they catch from
      # merging — the e2e job is the slow, partial backstop.
      - name: Run vitest
        run: npx vitest run

  # The single-tenant suite, split into shards (#119). Each shard is its own
  # runner, so it boots its own host via start-test-server.sh on its own
  # throwaway SQLite file (host/test.db on that runner) — no shard shares a
  # database with another. Inside a shard nothing changed: `playwright.config.ts`
  # keeps `workers: 1` / `fullyParallel: false`, so a shard runs whole spec
  # files in order. What sharding does require is that every spec file passes
  # without the others having run first, since a shard sees only its share.
  #
  # Three shards: the unsharded suite's test step took 9-11 minutes on a
  # ~40s cached setup, so each shard spends roughly as long setting up as
  # testing. A fourth shard would buy little more and cost another setup.
  e2e-shard:
    name: E2E shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    # A shard's tests run in about a third of the old 9-11 minutes. The budget
    # is set by the browser install's own 20-min cap (e2e-setup), which should
    # be what fires on a stalled apt mirror rather than this — the same
    # reasoning as `e2e-multi-tenant` below. Was 45 for the unsharded suite.
    timeout-minutes: 30
    strategy:
      # Let every shard finish, so one failure does not hide another's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # The production bundle, served by uvicorn without --reload (#119).
      E2E_BUNDLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/e2e-setup
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          uv-version: ${{ env.UV_VERSION }}

      # `--max-failures=1` aborts the shard on the first failing test so a
      # broken build doesn't drag the runner out to the job timeout. A test
      # that needed its retry fails the shard too (`failOnFlakyTests`).
      - name: Run Playwright tests
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: npm run test:e2e -- --shard="$SHARD" --max-failures=1

      # This shard's results, for the `e2e` job to merge into one report.
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1
          if-no-files-found: ignore

      # Traces, screenshots and videos of this shard's failures.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The one status that stands for the whole suite, under the name the
  # unsharded job had. It merges the shards' blob reports, writes the
  # flaky/failed summary from the merged report, and fails unless every shard
  # passed — so a shard that never produced a report (setup failed, timed out)
  # still fails it.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: e2e-shard
    if: ${{ !cancelled() }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `playwright merge-reports` needs @playwright/test; no browsers needed.
      - name: Install npm workspace
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      # The merged report keeps every test's status, so a flake in any shard
      # is still "flaky" here. JSON for the summary below, HTML to browse.
      - name: Merge shard reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-report/results.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/html
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          if compgen -G "all-blob-reports/*.zip" > /dev/null; then
            npx playwright merge-reports --reporter=json,html all-blob-reports
          else
            echo "No shard produced a blob report; see the shard jobs."
          fi

      # Lists every flaky and failed test in the job summary, and fails the
      # job on a flaky one or a failure (#119). A missing report is not a
      # failure here; the next step catches a shard that never wrote one.
      - name: Flaky and failed tests
        run: node scripts/e2e_report_summary.mjs

      - name: Every shard passed
        env:
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          if [[ "$SHARDS" != "success" ]]; then
            echo "::error::E2E shards: $SHARDS"
            exit 1
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  e2e-multi-tenant:
    name: E2E (multi-tenant)
    runs-on: ubuntu-latest
    # Two specs against a host with SM_MULTI_TENANT=true and every module
    # enabled. Most of the budget is setup and the webServer boot; 30 rather
    # than 20 so the browser install's own 20-min cap (e2e-setup) is what
    # fires on a stalled apt mirror, not the job's.
    timeout-minutes: 30
    env:
      E2E_MULTI_TENANT: "1"
      E2E_BUNDLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/e2e-setup
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          uv-version: ${{ env.UV_VERSION }}

      # The opt-in specs that need an active organisation. The `e2e-shard`
      # jobs run single-tenant and skip them. Not sharded: the whole job takes
      # about a minute, most of it setup.
      - name: Run multi-tenant Playwright tests
        run: npm run test:e2e -- billing-tenant billing-usage news-tenant records-tenant

      - name: Flaky and failed tests
        if: ${{ !cancelled() }}
        run: node scripts/e2e_report_summary.mjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-multi-tenant
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e-billing-user:
    name: E2E (billing per user)
    runs-on: ubuntu-latest
    # billing-user.spec.ts against a host with billing's subject_mode=user
    # (#274), which start-test-server.sh sets before boot. Same budget, and the
    # same reason, as `e2e-multi-tenant`.
    timeout-minutes: 30
    env:
      E2E_BILLING_USER: "1"
      E2E_BUNDLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/e2e-setup
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          uv-version: ${{ env.UV_VERSION }}

      # With E2E_BILLING_USER=1, playwright.config.ts matches billing-user.spec.ts
      # only; the `e2e-shard` jobs ignore it. Not sharded: one spec.
      - name: Run billing-per-user Playwright tests
        run: npm run test:e2e

      - name: Flaky and failed tests
        if: ${{ !cancelled() }}
        run: node scripts/e2e_report_summary.mjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-billing-user
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e-newsletter:
    name: E2E (newsletter)
    runs-on: ubuntu-latest
    # newsletter.spec.ts sends its campaign through the e2e-only dispatch hook,
    # which exists only on a development or testing host with Celery eager and
    # the in-memory broker (start-test-server.sh) and the console transport
    # (the spec sets it). The hook is a 404 in production, so this job runs the
    # dev server (SM_ENVIRONMENT=development, playwright.config.ts) rather than
    # the bundle: no E2E_BUNDLE. Same budget, and the same reason, as
    # `e2e-multi-tenant`.
    timeout-minutes: 30
    env:
      E2E_NEWSLETTER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/e2e-setup
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          uv-version: ${{ env.UV_VERSION }}

      # With E2E_NEWSLETTER=1, playwright.config.ts matches newsletter.spec.ts
      # only; every other run, the `e2e-shard` jobs included, ignores it.
      - name: Run newsletter Playwright tests
        run: npm run test:e2e

      - name: Flaky and failed tests
        if: ${{ !cancelled() }}
        run: node scripts/e2e_report_summary.mjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-newsletter
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The one job that runs background work the way production does (#339):
  # every e2e spec runs Celery eager, which has its own code path
  # (images' eager_drain, the eager branches in newsletter), so task
  # serialisation over a real broker, queue routing, a worker that never
  # builds the app and reads its settings from the database, and beat's
  # schedule are otherwise covered by unit tests only. The host runs
  # non-eager against a Redis service, beside one worker on the queues
  # `make worker` serves and one beat; scripts/bg_tasks_smoke.py then uploads
  # an image and waits for its pipeline to settle, and sends one campaign on
  # the console transport and waits for the `newsletter.dispatch` beat (every
  # minute) to mark it sent.
  #
  # Postgres rather than SQLite: three processes (web, the worker's pool,
  # beat) write the same database, as they do in production, and on Postgres
  # newsletter's dispatch lock is the session advisory lock production takes
  # (modules/newsletter/docs/operations.md), not the SQLite lease row.
  # SM_ENVIRONMENT=development because background_tasks refuses a localhost
  # broker anywhere else, and the service containers are on localhost.
  bg-tasks:
    name: Background tasks (Redis + Celery worker)
    runs-on: ubuntu-latest
    # Setup is ~1 min, the smoke under 2 (the campaign waits for the next
    # minute's beat tick); 20 caps a hung worker well short of the default.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      SM_ENVIRONMENT: development
      SM_PROJECT_ROOT: ${{ github.workspace }}
      SM_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci
      # Seeds both the broker and the result backend.
      SM_REDIS_URL: redis://localhost:6379/0
      SM_BG_TASKS_TASK_ALWAYS_EAGER: "false"
      SM_SECRET_KEY: bg-smoke-secret-key-not-for-production-use
      SM_USERS_BOOTSTRAP_EMAIL: admin@example.com
      SM_USERS_BOOTSTRAP_PASSWORD: changeme1
      # The unsubscribe link a campaign carries is built from it; a campaign
      # without one is refused at scheduling.
      SM_PUBLIC_BASE_URL: http://127.0.0.1:8000
      # host/worker.py is imported as `worker` (the Makefile's CELERY line).
      PYTHONPATH: host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      # No extras: a new collection runs `exif` and `renditions` only, which
      # are core.
      - name: Sync workspace (all packages)
        run: uv sync --locked --all-packages

      - name: Migrate (heads)
        run: uv run --no-sync --project host alembic -c host/alembic.ini upgrade heads

      # Before the worker starts: it reads these through settings_for and
      # caches them, and newsletter's default transport is smtp. The uploads go
      # to the runner's temp directory, which web and worker share.
      - name: Newsletter and storage settings
        run: |
          uv run --no-sync python scripts/set_setting.py sm_newsletter \
            transport console \
            from_address news@example.org \
            from_name "BG smoke" \
            physical_address "1 Test Street, 12345 Testville"
          uv run --no-sync python scripts/set_setting.py file_storage \
            fs_root_path "$RUNNER_TEMP/files"

      # One worker on the queues `make worker` serves (images, newsletter,
      # celery) and one beat: never two schedulers.
      - name: Start host, worker and beat
        run: |
          nohup uv run --no-sync --project host uvicorn main:app --app-dir host \
            --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/host.log" 2>&1 &
          nohup uv run --no-sync --project host celery -A worker:celery worker -l info \
            -Q images,newsletter,celery -c 2 > "$RUNNER_TEMP/worker.log" 2>&1 &
          nohup uv run --no-sync --project host celery -A worker:celery beat -l info \
            -s "$RUNNER_TEMP/celerybeat-schedule" > "$RUNNER_TEMP/beat.log" 2>&1 &

      # Waits for /health/live itself, then 3 min for the image and 4 for the
      # campaign.
      - name: Smoke (image pipeline, campaign dispatch)
        run: uv run --no-sync python scripts/bg_tasks_smoke.py --base-url http://127.0.0.1:8000

      - name: Host, worker and beat logs
        if: ${{ failure() }}
        run: |
          for name in host worker beat; do
            echo "::group::$name.log"
            cat "$RUNNER_TEMP/$name.log" || true
            echo "::endgroup::"
          done

  lint-js:
    name: Lint (biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm workspace
        run: npm ci

      - name: Biome check
        run: npx biome check .

  checks:
    name: Repo checks (metadata, readmes, strings, file size)
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: check_sibling_contracts.py reads each sibling
      # floor's release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}


      - name: Sync workspace
        run: uv sync --locked --all-packages --all-extras --no-extra anonymize

      # scripts/tests/test_nav_icons.py reads the framework's NavIcon.tsx out
      # of node_modules and skips itself when it is absent.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm workspace
        run: npm ci

      - name: Package metadata
        run: uv run python scripts/check_metadata.py

      # CLAUDE.md's honour-system rules (#135): no exact framework pin in a
      # published module, nothing but real pages under pages/, and sibling
      # extra floors that carry a `# floor: <reason>` comment.
      - name: CLAUDE.md rules
        run: uv run python scripts/check_rules.py

      # A sibling floor must ship every <sibling>.contracts module and name its
      # dependant imports (#333): checked at tag v<floor>.
      - name: Sibling floors ship the contracts used
        run: uv run python scripts/check_sibling_contracts.py

      # The 0.0.14 module-layout moves stay importable under their old paths
      # until 0.0.17 (#319). Stubs and tables match the generator, every
      # target exists, and nothing in this repo imports an old path.
      - name: Moved-path aliases
        run: uv run python scripts/moved_paths.py --check

      - name: READMEs
        run: uv run python scripts/check_readmes.py

      - name: Hardcoded strings
        run: uv run python scripts/check_hardcoded_strings.py

      - name: File size
        run: uv run python scripts/check_file_size.py

      # Every translated console catalogue has exactly en.json's keys and
      # placeholders, so a renamed English key cannot strand its translations.
      - name: Locale catalogues
        run: uv run python scripts/check_locales.py

      # Guards the lockstep invariant: every publishable manifest carries the
      # same version as the repo root.
      - name: Version sync
        run: uv run python scripts/bump_version.py --check-current

      # Two PRs that each add a revision off the same parent leave two heads
      # once both land; `make migration` then refuses and `make downgrade`
      # picks a branch. The Postgres job's `upgrade heads` would hide it (#107).
      - name: Single migration head
        run: uv run python scripts/check_migration_heads.py

      - name: Bump script tests
        run: uv run pytest scripts/tests
