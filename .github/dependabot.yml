# Weekly version updates, one grouped PR per ecosystem for minor and patch
# releases (#120). Major npm and uv releases stay out of the groups and open
# one PR each, so a single breaking upgrade cannot hold every other bump
# hostage. Security updates are unaffected by the groups below and still open
# as soon as an advisory lands.
#
# Not covered: the uv binary itself (`UV_VERSION` in ci.yml and release.yml,
# and the Dockerfile's `UV_VERSION` ARG) — Dependabot tracks the
# `astral-sh/setup-uv` action, not the uv version it installs — so bump those
# together by hand.
#
# Also not covered: the framework itself (`simple_module_*` on PyPI,
# `@simple-module-py/*` on npm). A framework bump moves the host's exact
# Python and npm pins together and is checked against the host's locale
# overrides (CLAUDE.md); a grouped PR that moved one ecosystem without the
# other, or rewrote a published module's `>=x,<0.1` range, would break that
# pin policy rather than help it.

version: 2
updates:
  # The workflows, plus the local composite actions under .github/actions,
  # which a `directory: /` entry does not look inside.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # One root package-lock.json covers every npm workspace (host/client_app
  # and modules/*).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "@simple-module-py/*"
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  # One root uv.lock covers the whole workspace (host and modules/*).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "simple_module_*"
      - dependency-name: "simple-module-*"
      # Held by `constraint-dependencies` in the root pyproject.toml (#170):
      # 0.0.45 retypes bare `datetime` columns. Drop both together.
      - dependency-name: "sqlmodel"
        versions: [">=0.0.45"]
    groups:
      uv:
        patterns: ["*"]
        update-types: [minor, patch]

  # The demo host's Dockerfile pins its python and node base images to an
  # exact tag and digest (#91); this keeps those current.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
