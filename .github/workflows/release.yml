# Lockstep release: one version, one tag, every module published.
#
# The tag reaches origin only in `finalize`, after every publish has
# succeeded, so a failed build never strands an orphan tag.
#
# One-time PyPI setup per module, at https://pypi.org/manage/account/publishing/
#   PyPI project name = simple_module_<name>
#   Owner             = antosubash
#   Repository name   = simple_module_python_modules
#   Workflow filename = release.yml
#   Environment       = pypi
#
# The `publish-pypi` matrix is read from `modules/*/pyproject.toml` by the
# `resolve` job, so a new module is published without editing this file
# (#118) — it still needs the one-time Trusted Publishing setup above.
#
# `astral-sh/setup-uv` is pinned to a full `x.y.z` tag, unlike the `actions/*`
# steps which float on their major. That is deliberate: setup-uv stopped
# publishing major/minor tags at v8 (as a supply-chain hardening measure), so
# `@v9` does not resolve. Dependabot proposes new releases. uv itself is
# pinned by `UV_VERSION` below, which Dependabot does not track; keep it equal
# to ci.yml's (#120).

name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump (ignored if `version` is set)"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Explicit version override (e.g. 0.2.0)"
        required: false
        type: string

permissions:
  contents: write
  id-token: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  UV_VERSION: "0.13.4"

jobs:
  # Resolve the release version once and share it with every downstream job.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Inputs reach the shell as environment variables, never as ${{ }}
      # interpolated into the script body — otherwise a crafted `version`
      # would be executed as shell before the format check below runs.
      - id: compute
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            ver="$INPUT_VERSION"
          else
            ver=$(BUMP="$INPUT_BUMP" python3 <<'PY'
          import os, pathlib, re, tomllib
          cur = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          m = re.match(r"^(\d+)\.(\d+)\.(\d+)", cur)
          if not m:
              raise SystemExit(f"cannot parse current version: {cur!r}")
          major, minor, patch = map(int, m.groups())
          bump = os.environ["BUMP"]
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          else:
              patch += 1
          print(f"{major}.{minor}.{patch}")
          PY
          )
          fi
          echo "${ver}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-]?(a|b|rc|alpha|beta)[0-9]*)?$' \
            || { echo "::error::'${ver}' is not a valid version"; exit 1; }
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${ver}"

      # The distribution name of every `modules/<name>/`, as a JSON list for
      # the `publish-pypi` matrix. An empty list fails here rather than
      # publishing nothing and tagging a release anyway.
      - id: packages
        shell: bash
        run: |
          packages=$(python3 <<'PY'
          import json, pathlib, tomllib
          names = sorted(
              tomllib.loads(p.read_text())["project"]["name"]
              for p in pathlib.Path("modules").glob("*/pyproject.toml")
          )
          if not names:
              raise SystemExit("no modules/*/pyproject.toml found")
          print(json.dumps(names))
          PY
          )
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"
          echo "Publishing: ${packages}"

  # Bump versions in the working tree only (no commit), build, upload.
  build:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm


      # `--locked` fails the release if uv.lock disagrees with the manifests,
      # rather than building from a silently re-resolved set (#114).
      - name: Sync workspace
        run: uv sync --locked --all-packages --all-extras

      - name: Bump versions (working tree only)
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: uv run python scripts/bump_version.py "$RELEASE_VERSION"

      - name: Install npm workspace
        run: npm ci

      - name: Build module frontends
        run: |
          make gen-pages
          npm run build

      - name: Build wheels + sdists
        run: uv build --all-packages --out-dir dist-py

      - uses: actions/upload-artifact@v7
        with:
          name: dist-py
          path: dist-py/
          retention-days: 14

  publish-pypi:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # mint OIDC token for PyPI Trusted Publishing
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.resolve.outputs.packages) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-py
          path: dist-py

      # uv writes wheels under the normalised (hyphenated) distribution name
      # while the sdist may use either form, so match both.
      - name: Select this package's artifacts
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          mkdir -p upload
          norm=$(echo "$PACKAGE" | tr '_' '-')
          find dist-py -maxdepth 1 -type f \
            \( -iname "$PACKAGE-*" -o -iname "$norm-*" \) \
            -exec cp {} upload/ \;
          ls -l upload
          test -n "$(ls -A upload)" || {
            echo "::error::no artifacts found for $PACKAGE"; exit 1; }

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload

  # Only now does anything reach origin.
  finalize:
    needs: [resolve, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Bump versions
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: uv run python scripts/bump_version.py "$RELEASE_VERSION"

      # The bump rewrites every workspace package's version, and uv.lock
      # records them. Re-lock so the release commit carries a lockfile that
      # matches its manifests; otherwise the next `uv sync --locked` in CI
      # fails and every local `uv run` dirties the tree (#114). `git add -A`
      # below commits it with the bump.
      - name: Re-lock
        run: uv lock

      - name: Commit and tag
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v$RELEASE_VERSION"
          # The tag must be annotated and pushed by explicit refspec.
          # `--follow-tags` silently skips lightweight tags, so it pushed the
          # commit and nothing else, and `gh release create` then refused to
          # act on a tag origin had never seen.
          git tag -a "v$RELEASE_VERSION" -m "Release v$RELEASE_VERSION"
          git push --atomic origin HEAD:main "refs/tags/v$RELEASE_VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: gh release create "v$RELEASE_VERSION" --generate-notes
