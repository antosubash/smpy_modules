<!doctype html>
<html lang="{{ lang }}">
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#1f2933;line-height:1.5">
<div style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #e3e6ea;border-radius:8px;padding:24px">
<p style="margin:0 0 16px;color:#52606d">{{ intro }}</p>
<h2 style="margin:0 0 12px;font-size:20px;line-height:1.3">{{ title }}</h2>
<p style="margin:0 0 8px"><strong>{{ when_line }}</strong></p>
{% for line in place_lines %}<p style="margin:0 0 8px">{{ line }}</p>
{% endfor %}{% if moved_line %}<p style="margin:0 0 8px;color:#b45309">{{ moved_line }}</p>
{% endif %}<p style="margin:16px 0 4px">{{ open_label }} <a href="{{ event_url }}" style="color:#047857">{{ event_url }}</a></p>
<p style="margin:0 0 16px">{{ manage_label }} <a href="{{ manage_url }}" style="color:#047857">{{ manage_url }}</a></p>
<hr style="border:0;border-top:1px solid #e3e6ea;margin:16px 0">
<p style="margin:0;font-size:12px;color:#7b8794">{{ footer }}</p>
</div>
</body>
</html>
