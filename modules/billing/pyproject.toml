[project]
name = "simple_module_billing"
version = "0.0.11"
description = "Plans, subscriptions and Stripe billing for multi-tenant SimpleModule apps"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
authors = [{ name = "Anto Subash", email = "antosubash@live.com" }]
keywords = ["simple-module", "billing", "saas", "stripe", "subscriptions", "tenants"]
# Ranges, never `==`: an exact framework pin makes a published module
# uninstallable in any host running a newer framework build. 0.0.35 was the
# first release carrying ``simple_module_tenants`` and its entitlements seam;
# the floor is 0.0.36 like every other module here (#211).
dependencies = [
    "simple_module_core>=0.0.36,<0.1",
    "simple_module_db>=0.0.36,<0.1",
    "simple_module_hosting>=0.0.36,<0.1",
    "simple_module_inertia>=0.0.36,<0.1",
    "simple_module_settings>=0.0.36,<0.1",
    "simple_module_tenants>=0.0.36,<0.1",
    "stripe>=16,<17",
    "cryptography>=42",
    "typer>=0.12",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    # ``Depends(..., scope="function")`` arrived in 0.121: ``RequiresQuota``
    # must exit before the response is sent (``sm_billing.metering.deps``).
    "fastapi>=0.121",
]

[project.urls]
Repository = "https://github.com/antosubash/simple_module_python_modules"

[project.entry-points.simple_module]
billing = "sm_billing.module:BillingModule"

# Mounted by the framework CLI as ``smpy billing <command>``.
[project.entry-points."simple_module_cli.cli_plugins"]
billing = "sm_billing.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "simple_module_test>=0.0.36,<0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sm_billing"]
# Frontend test files and their helpers sit beside the source they test, so
# `packages` would ship them. A host's Vite scans installed module source and
# skips dependency pre-bundling when it meets an import it cannot resolve
# (`vitest`), so none of them may reach the wheel (#63).
exclude = [
    "**/*.test.ts",
    "**/*.test.tsx",
    "**/__tests__/**",
    "**/test-dom.tsx",
    "**/*-test-support.ts",
]

# package.json lives at the module root so npm workspaces see it; copying it
# into the package lets the host discover JS deps after a pip install. This
# module ships no bundled frontend build, so there is no dist to include.
[tool.hatch.build.targets.wheel.force-include]
"package.json" = "sm_billing/package.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
