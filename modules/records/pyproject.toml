[project]
name = "simple_module_records"
version = "0.0.7"
description = "Generic structured content: admin-defined record types stored as JSON documents with typed SQL indexes (YesSql-style document/index split)"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
authors = [{ name = "Anto Subash", email = "antosubash@live.com" }]
keywords = ["simple-module", "records", "content", "cms", "headless", "json"]
# Ranges, never `==`: an exact framework pin makes a published module
# uninstallable in any host running a newer framework build.
dependencies = [
    "simple_module_core>=0.0.35,<0.1",
    "simple_module_db>=0.0.35,<0.1",
    "simple_module_hosting>=0.0.35,<0.1",
    "simple_module_inertia>=0.0.35,<0.1",
    "simple_module_settings>=0.0.35,<0.1",
    "pydantic-settings>=2.0",
]

[project.urls]
Repository = "https://github.com/antosubash/simple_module_python_modules"

[project.entry-points.simple_module]
records = "sm_records.module:RecordsModule"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "simple_module_test>=0.0.35,<0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sm_records"]
artifacts = ["sm_records/static/dist/**"]

# package.json lives at the module root so npm workspaces see it; copying it
# into the package lets the host discover JS deps after a pip install.
[tool.hatch.build.targets.wheel.force-include]
"package.json" = "sm_records/package.json"

[tool.hatch.build.targets.sdist]
artifacts = ["sm_records/static/dist/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The perf suite (``tests/perf``) seeds a file-backed SQLite database and
# measures; it is minutes, not seconds, and it is not a correctness gate. It
# is excluded here so ``pytest`` and CI keep running only the normal suite —
# run it explicitly with ``pytest -m perf tests/perf``.
markers = [
    "perf: performance measurement, excluded from the default run",
    "unbound_tenant: run with no records tenant bound (tests/conftest.py binds 'default' otherwise)",
]
addopts = "-m 'not perf'"
