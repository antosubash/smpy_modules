[project]
name = "simple_module_news"
version = "0.0.7"
description = "A self-contained news archive — articles, categories, tags and a public viewer"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
authors = [{ name = "Anto Subash", email = "antosubash@live.com" }]
keywords = ["simple-module", "news", "articles", "cms"]
# Ranges, never `==`: an exact framework pin makes a published module
# uninstallable in any host running a newer framework build.
dependencies = [
    "simple_module_core>=0.0.25,<0.1",
    "simple_module_db>=0.0.25,<0.1",
    "simple_module_hosting>=0.0.25,<0.1",
    # ``register_settings`` imports ``settings.registration``: this module's
    # settings are DB-backed rather than read from the environment. Floor
    # verified: ``register_module_settings`` exists at 0.0.25.
    "simple_module_settings>=0.0.25,<0.1",
    # simple_module_pagebuilder is deliberately NOT here — it is an optional
    # extra below. main carried it as a hard dependency because an article's
    # body lived in a pagebuilder page; this branch gives the article its own
    # content, so the only things left behind it are two conveniences.
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
]

[project.urls]
Repository = "https://github.com/antosubash/simple_module_python_modules"

[project.entry-points.simple_module]
news = "news.module:NewsModule"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "simple_module_test>=0.0.25,<0.1"]
# Optional, and only for two conveniences on a host that runs both modules: the
# admin search screen gains a Pages and a Media section, and the NewsFeed block
# joins pagebuilder's palette. Nothing here imports it at module scope — see
# ``news/integrations/pagebuilder.py`` — so news installs and serves without it.
#
# Must stay a 0.0.x range: the repo publishes at 0.0.x, so `>=0.1` would be
# unsatisfiable and the extra uninstallable.
#
# Floor raised from 0.0.1 for the NewsFeed block's labels, which are catalogue
# keys resolved by *pagebuilder's* ``localizeConfig`` — added in 0.0.8. On an
# older neighbour nothing crashes, but every label in that block's palette
# entry renders as its own dotted key, which is worse than the English it
# replaced. The floor is what makes holding keys there safe.
pagebuilder = ["simple_module_pagebuilder>=0.0.8,<0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["news"]

# package.json lives at the module root so npm workspaces see it; copying it
# into the package lets the host discover JS deps after a pip install. This
# module ships no bundled frontend build, so there is no dist to include.
[tool.hatch.build.targets.wheel.force-include]
"package.json" = "news/package.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"

# Resolve the sibling module from the workspace during development. This is
# tool config, so the published wheel still carries the range above.
[tool.uv.sources]
simple_module_pagebuilder = { workspace = true }
