[project]
name = "simple_module_canopy_atlas"
version = "0.1.0"
description = "Global Canopy Atlas site — design pack, brand assets and seed content"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
authors = [{ name = "Anto Subash", email = "antosubash@live.com" }]
keywords = ["simple-module", "canopy-atlas", "design-pack", "seed"]
# Ranges, never `==`: an exact framework pin makes a published module
# uninstallable in any host running a newer framework build.
dependencies = [
    # 0.0.26 floor: this module imports `simple_module_core.design_packs` and
    # relies on the host calling `register_design_packs`, neither of which
    # exists in 0.0.25. Installing it against 0.0.25 fails at import, not at
    # first render, so the floor has to say so.
    "simple_module_core>=0.0.26,<0.1",
    "simple_module_db>=0.0.25,<0.1",
    "simple_module_hosting>=0.0.26,<0.1",
    "simple_module_pagebuilder>=0.1,<0.2",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
]

[project.urls]
Repository = "https://github.com/antosubash/simple_module_python_modules"

[project.entry-points.simple_module]
canopy_atlas = "canopy_atlas.module:CanopyAtlasModule"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "simple_module_test>=0.0.25,<0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["canopy_atlas"]

# The brand assets and the design pack are tracked files, so hatchling's
# VCS-aware selection already picks them up — unlike pagebuilder, this module
# ships no gitignored build output and needs no `artifacts` entry.
# package.json lives at the module root so npm workspaces see it; copying it
# into the package lets the host discover JS deps after a pip install.
[tool.hatch.build.targets.wheel.force-include]
"package.json" = "canopy_atlas/package.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"

# Resolve the sibling module from the workspace during development. This is
# tool config, so the published wheel still carries the range above.
[tool.uv.sources]
simple_module_pagebuilder = { workspace = true }
